[package]
name = "jimjam"
version = "0.0.2"
edition = "2021"
description = "A configurable HTTP mock server with YAML-defined responses"
license = "MIT"
readme = "README.md"
repository = "https://github.com/michaelmccabe/jimjam"
homepage = "https://github.com/michaelmccabe/jimjam"
documentation = "https://docs.rs/jimjam"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
glob = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
regex = "1"
notify = "6"
notify-debouncer-mini = "0.4"

[profile.dev]
debug = true
debug-assertions = true
overflow-checks = true
incremental = true
opt-level = 0

[profile.release]
debug = false
lto = true
codegen-units = 1
panic = "abort"

[workspace.metadata.dist]
cargo-dist-version = "0.8.0"
ci = ["github"]
installers = ["shell", "homebrew"]
targets = ["x86_64-unknown-linux-gnu", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-pc-windows-msvc"]
